services:
  - type: web
    name: health-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn health_monitoring.wsgi:application"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: health_monitoring.settings
      - key: DATABASE_URL
        fromDatabase:
          name: healthdb
          property: connectionString
    plan: free
